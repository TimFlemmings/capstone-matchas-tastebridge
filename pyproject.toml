[project]
name = "tastebridge"
version = "0.1.0"
description = "User-controlled and explainable music discovery recommender"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "statsmodels",
    "mlflow",
    "parsenvy",
    "jupyter>=1.1.1",
    "librosa>=0.11.0",
    "soundfile>=0.14.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "huggingface-hub>=1.31.0",
    "streamlit>=1.63.0",
    "plotly>=7.0.0",
    "networkx>=3.6.1",
    "pycountry>=24.6.1",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "seaborn",
    "pytest",
    "testbook",
    "black",
    "nbdime",
]

[tool.uv]
package = false
